[package]
name = "rabex-texture"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Decode Unity Texture2D pixel data into RGBA images and render Sprites."

[dependencies]
anyhow = "1.0"
rabex = { version = "0.2", default-features = false }
texture2ddecoder = { git = "https://github.com/jakobhellermann/texture2ddecoder-rs", branch = "dev" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
rabex = { version = "0.2", default-features = false, features = ["compression-lz4"] }
serde_json = "1.0"
